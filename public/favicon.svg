<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D0716" />
      <stop offset="70%" stop-color="#1A0509" />
      <stop offset="100%" stop-color="#120205" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4ECE0" />
      <stop offset="35%" stop-color="#E6D3A3" />
      <stop offset="70%" stop-color="#C9A66B" />
      <stop offset="100%" stop-color="#A8803F" />
    </linearGradient>
    <linearGradient id="innerRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8803F" />
      <stop offset="50%" stop-color="#E6D3A3" />
      <stop offset="100%" stop-color="#C9A66B" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Outer background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Concentric inner luxury gold rings -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#innerRing)" stroke-width="1" stroke-dasharray="2 1.5" opacity="0.75" />
  <circle cx="60" cy="60" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" />

  <!-- Monogram MS Ribbon Style -->
  <g id="monogram" filter="url(#goldGlow)">
    <!-- M letter -->
    <path d="M38 78 V44 L51 63 L64 44 V78" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- S Ribbon overlay -->
    <path d="M58 48 C63 43 76 43 79 50 C81 55 77 60 67 63 C57 66 57 73 63 76 C69 79 79 76 82 71" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Decorative luxury dots -->
  <circle cx="60" cy="20" r="1.8" fill="url(#goldGrad)" />
  <circle cx="60" cy="100" r="1.8" fill="url(#goldGrad)" />
  <circle cx="20" cy="60" r="1.8" fill="url(#goldGrad)" />
  <circle cx="100" cy="60" r="1.8" fill="url(#goldGrad)" />
</svg>